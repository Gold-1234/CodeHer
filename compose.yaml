version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://backend:8080

  backend:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/codeher
      - JUDGE0_URL=http://judge0:2358
    depends_on:
      postgres:
        condition: service_healthy
      judge0:
        condition: service_started
    volumes:
      - ./prisma:/usr/src/app/prisma

  postgres:
    build:
      context: ../postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=codeher
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  judge0:
    build:
      context: ../judge0
    ports:
      - "2358:2358"
    environment:
      - JUDGE0_CE_JWT_SECRET=your_jwt_secret_here

volumes:
  postgres_data:
